name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated: web,api,sync or "all")'
        required: false
        default: all

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      sync: ${{ steps.filter.outputs.sync }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
            api:
              - 'apps/api-cf/**'
              - 'apps/render-server/**'
              - 'packages/**'
            sync:
              - 'apps/loro-sync-server/**'
              - 'packages/**'

  deploy-web:
    name: Deploy Web (Worker)
    runs-on: ubuntu-latest
    needs: [changes]
    if: >
      github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'web'))
      || needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build SPA
        working-directory: apps/web
        run: pnpm build
        env:
          API_CF_URL: ${{ vars.API_CF_URL }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

  deploy-api:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    needs: [changes]
    if: >
      github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'api'))
      || needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Sync secrets: wrangler-action's `secrets:` input takes a newline-list
      # of secret names; values come from env vars of the same name. Action
      # internally calls `wrangler secret bulk` with the correct syntax for
      # the installed wrangler version (avoids the legacy `secret:bulk` +
      # stdin pipe that broke on wrangler 4).
      - name: Deploy API to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api-cf
          command: deploy
          secrets: |
            GOOGLE_API_KEY
            GOOGLE_AI_STUDIO_BASE_URL
            CF_AIG_TOKEN
            CF_AIG_OPENAI_URL
            FAL_API_KEY
            FAL_GATEWAY_URL
            R2_PUBLIC_URL
            KLING_ACCESS_KEY
            KLING_SECRET_KEY
            JWT_SECRET
            BETTER_AUTH_SECRET
            BETTER_AUTH_URL
            AUTH_GOOGLE_ID
            AUTH_GOOGLE_SECRET
            GOOGLE_CLIENT_EMAIL
            GOOGLE_PRIVATE_KEY
            GOOGLE_CLOUD_PROJECT
            GOOGLE_CLOUD_LOCATION
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_AI_STUDIO_BASE_URL: ${{ secrets.GOOGLE_AI_STUDIO_BASE_URL }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
          CF_AIG_OPENAI_URL: ${{ secrets.CF_AIG_OPENAI_URL }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          FAL_GATEWAY_URL: ${{ secrets.FAL_GATEWAY_URL }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          KLING_ACCESS_KEY: ${{ secrets.KLING_ACCESS_KEY }}
          KLING_SECRET_KEY: ${{ secrets.KLING_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}

  deploy-sync:
    name: Deploy Sync Server Worker
    runs-on: ubuntu-latest
    needs: [changes]
    if: >
      github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'sync'))
      || needs.changes.outputs.sync == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy Sync Server to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/loro-sync-server
          command: deploy

  migrate-d1:
    name: Run D1 Migrations
    runs-on: ubuntu-latest
    needs: [deploy-web]
    if: always() && needs.deploy-web.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Run D1 Migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: d1 migrations apply master-clash-frontend --remote
