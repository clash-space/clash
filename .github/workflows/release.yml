name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  package-desktop:
    name: Package Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS-arm64
            script: pack:desktop:mac:arm64
            asset: apps/desktop/release/Clash-Desktop-macOS-arm64.dmg
          - os: macos-latest
            platform: macOS-x64
            script: pack:desktop:mac:x64
            asset: apps/desktop/release/Clash-Desktop-macOS-x64.dmg
          - os: windows-latest
            platform: Windows
            script: pack:desktop:win
            asset: apps/desktop/release/Clash-Desktop-Windows-x64.exe
          - os: ubuntu-latest
            platform: Linux
            script: pack:desktop:linux
            asset: apps/desktop/release/Clash-Desktop-Linux-x64.AppImage
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout OpenMA common for the desktop renderer
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/openma-ai/openma-common.git ../openma-common
          git -C ../openma-common checkout 00358ff9c1e4a694171f5617a4715602c61433e7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg libfuse2

      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.script }}

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Desktop-${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish-desktop-preview:
    name: Publish Desktop Preview
    runs-on: ubuntu-latest
    needs: [package-desktop]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: Clash-Desktop-*
          path: desktop-artifacts
          merge-multiple: true

      - name: Point the rolling preview tag at this build
        run: |
          git tag --force desktop-preview "$GITHUB_SHA"
          git push origin refs/tags/desktop-preview --force

      - name: Create or update the rolling desktop preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view desktop-preview >/dev/null 2>&1; then
            gh release edit desktop-preview \
              --title "Clash Desktop Preview" \
              --notes "Unsigned preview installers built from ${GITHUB_SHA}. Where agents co-create, humans are welcome too." \
              --prerelease
          else
            gh release create desktop-preview \
              --title "Clash Desktop Preview" \
              --notes "Unsigned preview installers built from ${GITHUB_SHA}. Where agents co-create, humans are welcome too." \
              --prerelease
          fi
          gh release upload desktop-preview desktop-artifacts/Clash-Desktop-* --clobber
