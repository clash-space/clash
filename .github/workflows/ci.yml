name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint --concurrency=1

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run type-check --concurrency=1

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --concurrency=1

  agent-first-local-v1:
    name: Agent-First Local V1 Gate
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:agent-first-local-v1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --concurrency=1
