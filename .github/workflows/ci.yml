name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint --concurrency=1

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run type-check --concurrency=1

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --concurrency=1

  agent-first-local-v1:
    name: Agent-First Local V1 Gate
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --concurrency=1
      - run: pnpm test:e2e:agent-first-local-v1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --concurrency=1

  package-desktop:
    name: Package Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: [build, agent-first-local-v1]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS-arm64
            script: pack:mac:arm64
            asset: apps/desktop/release/Clash-Desktop-macOS-arm64.dmg
          - os: macos-latest
            platform: macOS-x64
            script: pack:mac:x64
            asset: apps/desktop/release/Clash-Desktop-macOS-x64.dmg
          - os: windows-latest
            platform: Windows
            script: pack:win
            asset: apps/desktop/release/Clash-Desktop-Windows-x64.exe
          - os: ubuntu-latest
            platform: Linux
            script: pack:linux
            asset: apps/desktop/release/Clash-Desktop-Linux-x64.AppImage
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg libfuse2

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @master-clash/desktop run ${{ matrix.script }}

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Desktop-${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
