name: Publish Beta

on:
  workflow_dispatch:

jobs:
  publish-beta:
    name: Publish Beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@clash-space/cli --filter=@clash-space/action-sdk --filter=@clash-space/bridge

      - name: Publish @clash-space/cli
        run: pnpm --filter @clash-space/cli publish --tag beta --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @clash-space/action-sdk
        run: pnpm --filter @clash-space/action-sdk publish --tag beta --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @clash-space/bridge
        # Use `npm publish` instead of `pnpm --filter publish`. pnpm 8.15.0
        # has a publish bug that uploads an empty tarball then retries with
        # a 403 — see workflow run 25002298123. npm publish from within the
        # package directory takes a different code path and works.
        working-directory: packages/clash-bridge
        run: npm publish --tag beta --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
