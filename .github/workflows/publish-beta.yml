name: Publish Beta

on:
  workflow_dispatch:

jobs:
  publish-beta:
    name: Publish Beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@clash-space/cli --filter=@clash-space/action-sdk --filter=@clash-space/bridge

      - name: Publish @clash-space/cli
        run: pnpm --filter @clash-space/cli publish --tag beta --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @clash-space/action-sdk
        run: pnpm --filter @clash-space/action-sdk publish --tag beta --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @clash-space/bridge
        # Earlier attempts (beta.{1,2,3}) all landed on the registry as a
        # 2KB tarball missing dist/, even though the `npm publish` log said
        # the tarball was 11KB and included dist/cli.js — and the second
        # HTTP request errored 403 "already published". Split pack + publish
        # so we (a) verify dist is in the tarball before upload, (b) hand
        # npm a literal file instead of letting it re-pack mid-publish.
        working-directory: packages/clash-bridge
        run: |
          set -euo pipefail
          ls -la dist/
          npm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/clash-space-bridge-*.tgz | tail -1)
          echo "Tarball contents:"
          tar -tzf "$TARBALL"
          if ! tar -tzf "$TARBALL" | grep -q '^package/dist/cli\.js$'; then
            echo "::error::tarball is missing dist/cli.js, refusing to publish"
            exit 1
          fi
          npm publish "$TARBALL" --tag beta --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
