name: Publish Beta

on:
  workflow_dispatch:

jobs:
  publish-beta:
    name: Publish Beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@clash-space/cli --filter=@clash-space/action-sdk --filter=@clash-space/bridge

      - name: Publish @clash-space/cli
        run: pnpm --filter @clash-space/cli publish --tag beta --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @clash-space/action-sdk
        run: pnpm --filter @clash-space/action-sdk publish --tag beta --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @clash-space/bridge
        # Beta.{1..4} all uploaded a 2KB LICENSE+package.json tarball
        # despite `npm pack` producing the correct 16KB one with dist/cli.js.
        # Even passing the literal .tgz to `npm publish $TARBALL` from the
        # source directory uploaded the wrong content. Hypothesis: npm
        # publish re-walks the cwd, and something in the bridge's cwd
        # (gitignore? files field interaction?) makes it skip dist.
        #
        # Workaround: extract the verified pack into a fresh temp dir that
        # contains nothing else, cd into it, npm publish from there. Forces
        # npm to use exactly the files we want — same approach 1Password
        # uses for cli releases.
        working-directory: packages/clash-bridge
        run: |
          set -euo pipefail
          ls -la dist/
          npm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/clash-space-bridge-*.tgz | tail -1)
          if ! tar -tzf "$TARBALL" | grep -q '^package/dist/cli\.js$'; then
            echo "::error::pack output missing dist/cli.js"
            exit 1
          fi
          mkdir /tmp/clash-bridge-publish
          tar -xzf "$TARBALL" -C /tmp/clash-bridge-publish --strip-components=1
          echo "About to publish from /tmp/clash-bridge-publish:"
          ls -la /tmp/clash-bridge-publish
          ls -la /tmp/clash-bridge-publish/dist
          cd /tmp/clash-bridge-publish
          npm publish --tag beta --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
