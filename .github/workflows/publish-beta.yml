name: Publish Beta

on:
  workflow_dispatch:

jobs:
  publish-beta:
    name: Publish Beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@clash-space/cli --filter=@clash-space/action-sdk --filter=@clash-space/bridge

      - name: Publish @clash-space/cli
        run: pnpm --filter @clash-space/cli publish --tag beta --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @clash-space/action-sdk
        run: pnpm --filter @clash-space/action-sdk publish --tag beta --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @clash-space/bridge
        # Five attempts via npm publish / pnpm publish (beta.{1..5}) all
        # uploaded a 2KB LICENSE+package.json tarball even though pack +
        # tar -tzf verification before upload showed dist/cli.js present.
        # Whatever npm publish does between pack and PUT is uploading
        # different bytes than what pack made.
        #
        # Bypass: scripts/publish.mjs talks to the npm registry HTTP API
        # directly with the verified tarball as the PUT body. No re-pack,
        # no cwd-walking, npm CLI not in the loop.
        working-directory: packages/clash-bridge
        run: |
          set -euo pipefail
          ls -la dist/
          npm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/clash-space-bridge-*.tgz | tail -1)
          if ! tar -tzf "$TARBALL" | grep -q '^package/dist/cli\.js$'; then
            echo "::error::pack output missing dist/cli.js"
            exit 1
          fi
          node scripts/publish.mjs "$TARBALL" --tag beta
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
