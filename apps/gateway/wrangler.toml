name = "gateway"
main = "src/index.ts"
compatibility_date = "2024-11-20"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding (for project ownership checks)
[[d1_databases]]
binding = "DB"
database_name = "master-clash-frontend"
database_id = "aab16eeb-a375-490b-ad1e-cd092cd9f4bb"

# Service Bindings (production)
[[services]]
binding = "API_CF"
service = "master-clash-api"

# Frontend service binding (production only — in dev, FRONTEND_URL is used)
# [[services]]
# binding = "FRONTEND"
# service = "clash-flow"

[vars]
BETTER_AUTH_BASE_PATH = "/api/better-auth"
BETTER_AUTH_ORIGIN = "http://127.0.0.1:3001"
# Local dev fallbacks (overridden by service bindings in production)
FRONTEND_URL = "http://127.0.0.1:3001"
API_CF_URL = "http://127.0.0.1:8789"

# Development environment
[env.development]
vars = { ENVIRONMENT = "development" }

# Production environment
[env.production]
vars = { ENVIRONMENT = "production" }
