appId: app.clash.video
productName: Clash
asar: true
npmRebuild: false
publish: null

directories:
  output: release

files:
  - dist/**/*
  - package.json
  - '!src/**/*'
  - '!e2e/**/*'
  - '!*.test.*'

extraResources:
  - from: ../web/dist/client
    to: web-dist

mac:
  category: public.app-category.video
  icon: build/icon.icns
  identity: null
  target:
    - dir
    - dmg
