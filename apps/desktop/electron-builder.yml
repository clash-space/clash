appId: app.clash.video
productName: Clash
asar: true
npmRebuild: false
publish: null

directories:
  output: release

files:
  - dist/**/*
  - package.json
  - '!src/**/*'
  - '!e2e/**/*'
  - '!*.test.*'

extraResources:
  - from: ../web/dist/client
    to: web-dist
  - from: build/acp-bin
    to: acp-bin
    filter:
      - "**/*"
  - from: build/acp-node
    to: acp-node
    filter:
      - "**/*"
  - from: build/clash-cli
    to: clash-cli
    filter:
      - "**/*"

mac:
  category: public.app-category.video
  icon: build/icon.icns
  identity: null
  target:
    - dir
    - dmg
