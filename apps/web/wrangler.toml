# OSS reference config for self-hosters. The hosted clash.video deploy lives
# in clash-hosted/apps/web-hosted/wrangler.toml — that one points its `main`
# at this directory's workers/app.ts via the OSS git submodule.

name = "clash-web"
main = "workers/app.ts"
compatibility_date = "2025-04-08"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "./dist/client"
not_found_handling = "single-page-application"
# Without this, the assets layer answers any text/html GET (incl. OAuth
# callbacks like /api/better-auth/callback/google) with index.html before the
# Worker sees it. With run_worker_first the Worker handles the request first
# and decides whether to fall through to env.ASSETS for the SPA shell.
run_worker_first = true

# D1 (shared with api-cf for users / sessions / app tables)
[[d1_databases]]
binding = "DB"
database_name = "master-clash-frontend"
database_id = "aab16eeb-a375-490b-ad1e-cd092cd9f4bb"
migrations_dir = "drizzle"

# Service binding to api-cf worker. Self-hosters point this at their own
# api-cf deploy; the hosted overlay overrides this to master-clash-api-hosted.
[[services]]
binding = "API_CF"
service = "master-clash-api"

# R2 bucket (used by /api/upload/asset + /api/assets/view/*)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "master-clash-assets"

[vars]
BETTER_AUTH_BASE_PATH = "/api/better-auth"
# Dev fallback when the service binding can't resolve api-cf (e.g. running
# wrangler dev for one Worker but not the other).
API_CF_URL = "http://127.0.0.1:8789"

[dev]
port = 3001
ip = "0.0.0.0"
