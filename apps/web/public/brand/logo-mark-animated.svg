<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Clash agent thinking mark">
  <style>
    .face {
      transform-origin: 48px 48px;
      animation: settle 4200ms cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    .eyes {
      animation: gaze 4200ms cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    .eye {
      fill: #070B1F;
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4200ms cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .slash {
      fill: #FF6B50;
      transform-origin: 71.75px 71.5px;
      transform: rotate(24deg);
      animation: slash-think 4200ms cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    .spark {
      fill: none;
      stroke: #FF6B50;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 1 17;
      opacity: 0;
      animation: spark 4200ms cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes settle {
      0%, 100% { transform: translateY(0); }
      42% { transform: translateY(-1.5px); }
      68% { transform: translateY(0.75px); }
    }
    @keyframes gaze {
      0%, 18% { transform: translateX(0); }
      30%, 43% { transform: translateX(-2.25px); }
      55%, 66% { transform: translateX(1.75px); }
      80%, 100% { transform: translateX(0); }
    }
    @keyframes blink {
      0%, 31%, 35%, 70%, 74%, 100% { transform: scaleY(1); }
      33%, 72% { transform: scaleY(0.55); }
    }
    @keyframes slash-think {
      0%, 100% { transform: translate(0, 0) rotate(24deg); }
      20% { transform: translate(-0.5px, -2px) rotate(21deg); }
      36% { transform: translate(1.5px, -3px) rotate(28deg); }
      57% { transform: translate(-1px, 1.5px) rotate(22deg); }
      74% { transform: translate(0.75px, -1px) rotate(26deg); }
    }
    @keyframes spark {
      0%, 38%, 100% { opacity: 0; stroke-dashoffset: 0; transform: scale(0.94); }
      46% { opacity: 0.72; }
      62% { opacity: 0; stroke-dashoffset: -17; transform: scale(1.05); }
    }
    @media (prefers-reduced-motion: reduce) {
      .face, .eyes, .eye, .slash, .spark { animation: none; }
    }
  </style>
  <g class="face">
    <path
      d="M 73 47
         L 73 31
         C 73 22.7 66.3 16 58 16
         L 31 16
         C 22.7 16 16 22.7 16 31
         L 16 65
         C 16 73.3 22.7 80 31 80
         L 51 80"
      fill="none"
      stroke="#070B1F"
      stroke-width="6.75"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <g class="eyes">
      <rect class="eye" x="35" y="38" width="6" height="16" rx="3" />
      <rect class="eye" x="51" y="38" width="6" height="16" rx="3" />
    </g>
    <path class="spark" d="M 61 76 Q 64 70 69 64" />
    <rect class="slash" x="68" y="58" width="7.5" height="27" rx="3.75" />
  </g>
</svg>
